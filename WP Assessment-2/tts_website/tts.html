<!DOCTYPE HTML>
<html>
<head>
<meta charset = UTF-8>
<title>Text-to-speech Website</title>
<link rel = "stylesheet" href = "TTSstyling.css">
</head>
<body>

    <div class = "content-heading">
        <img class = "logo-fbt" src = "fbt.jpg" alt = "FBT Logo">
        <h1 class = "title-header">Simple Text To Speech Converter</h1><br>
    </div>

    <div class = "outer-container"> 
        <div class = "inner-container">

            <div class = "content-description">
                <p>This is a simple text to speech website. It allows the user to convert text to an audio file and download it.</p><br>
            </div>

            <div class = "content-label">
                <label>Type below here to convert the text to speech</label><br>
            </div>

            <div class = "content-text">
                <textarea id = converttext placeholder = "Convert to Speech..." id = "" cols = "60" rows = "15"></textarea><br>
            </div>
            
            <p class = "error-msg"></p>

            <div class = "content-button">
                <button class = "convert-class" id = convertBtn>Convert & Play</button>
            </div>
        </div>
    </div>
    <script src = "TTSjavascript.js"></script>

</body>
</html>
